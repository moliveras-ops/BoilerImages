name: Prueba brillo y enfoque

on:
  push:
    branches: [prueba-brillo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: bash prueba/brillo.sh
      - name: Subir resultados a la rama prueba-brillo-resultados
        if: always()
        run: |
          rm -f prueba/salida/ui.xml
          git config user.name "Prueba emulador"; git config user.email "noreply@github.com"
          git checkout --orphan prueba-brillo-resultados
          git rm -rq --cached . ; git add -f prueba/salida
          git commit -qm "Resultados $GITHUB_RUN_ID"
          git push -f origin prueba-brillo-resultados
